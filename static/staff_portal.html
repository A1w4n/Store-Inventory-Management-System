<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProStock — Staff Purchase Portal</title>
<style>
  /* ── Reset & base ─────────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f3f4f6;
    color: #111827;
    min-height: 100vh;
  }

  /* ── Top nav ──────────────────────────────────────────────────────────── */
  nav {
    background: linear-gradient(135deg, #111827 0%, #4f46e5 100%);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    position: sticky; top: 0; z-index: 100;
  }
  nav .logo { font-size: 26px; }
  nav h1 { color: #fff; font-size: 20px; font-weight: 700; }
  nav .badge {
    margin-left: auto;
    background: #4f46e5;
    color: #e0e7ff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #6366f1;
  }

  /* ── Layout ───────────────────────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
    max-width: 1280px;
    margin: 24px auto;
    padding: 0 24px 40px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .cart-panel { position: static !important; }
  }

  /* ── Card ─────────────────────────────────────────────────────────────── */
  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid #f3f4f6;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-header h2 { font-size: 15px; font-weight: 700; color: #111827; }
  .card-header span.icon { font-size: 18px; }
  .card-body { padding: 18px 22px; }

  /* ── Search bar ───────────────────────────────────────────────────────── */
  .search-wrap {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .search-wrap input {
    flex: 1;
    height: 42px;
    padding: 0 14px;
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    font-size: 14px;
    color: #111827;
    background: #f9fafb;
    outline: none;
    transition: border-color .15s;
  }
  .search-wrap input:focus { border-color: #4f46e5; background: #fff; }

  /* ── Staff name ───────────────────────────────────────────────────────── */
  .staff-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .staff-row label { font-size: 13px; font-weight: 600; color: #6b7280; white-space: nowrap; }
  .staff-row input {
    flex: 1;
    height: 38px;
    padding: 0 12px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 13px;
    color: #111827;
    background: #f9fafb;
    outline: none;
  }
  .staff-row input:focus { border-color: #4f46e5; background: #fff; }

  /* ── Item grid ────────────────────────────────────────────────────────── */
  #item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 14px;
  }
  .item-card {
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    padding: 14px 12px 12px;
    background: #fff;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .1s;
    position: relative;
    user-select: none;
  }
  .item-card:hover {
    border-color: #6366f1;
    box-shadow: 0 4px 14px rgba(99,102,241,.15);
    transform: translateY(-2px);
  }
  .item-card.out-of-stock {
    opacity: .5; cursor: not-allowed;
  }
  .item-card.out-of-stock:hover { transform: none; box-shadow: none; border-color: #e5e7eb; }
  .item-img {
    width: 100%; height: 90px;
    object-fit: contain;
    border-radius: 8px;
    background: #f3f4f6;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #9ca3af;
  }
  .item-img img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  .item-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #111827; line-height: 1.3; }
  .item-cat  { font-size: 11px; color: #9ca3af; margin-bottom: 6px; }
  .item-foot { display: flex; justify-content: space-between; align-items: center; }
  .item-price { font-size: 13px; font-weight: 700; color: #4f46e5; }
  .item-stock { font-size: 11px; color: #6b7280; }
  .item-stock.low { color: #f59e0b; font-weight: 600; }
  .item-stock.none { color: #ef4444; font-weight: 600; }
  .add-badge {
    position: absolute; top: 8px; right: 8px;
    background: #4f46e5; color: #fff;
    font-size: 11px; font-weight: 700;
    border-radius: 20px; padding: 2px 8px;
    display: none;
  }
  .item-card.in-cart .add-badge { display: block; }

  /* ── Empty / loading states ───────────────────────────────────────────── */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 48px 0;
    color: #9ca3af;
    font-size: 14px;
  }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }

  /* ── Cart panel ───────────────────────────────────────────────────────── */
  .cart-panel {
    position: sticky;
    top: 80px;
    align-self: start;
  }
  .cart-empty {
    text-align: center;
    padding: 32px 0;
    color: #9ca3af;
    font-size: 13px;
  }
  .cart-empty .big { font-size: 36px; margin-bottom: 8px; }

  /* cart lines */
  #cart-lines { display: flex; flex-direction: column; gap: 10px; }
  .cart-line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #f9fafb;
    border-radius: 10px;
    border: 1px solid #e5e7eb;
  }
  .cart-line-info { flex: 1; min-width: 0; }
  .cart-line-name { font-size: 13px; font-weight: 600; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-line-price { font-size: 12px; color: #6b7280; }
  .qty-ctrl { display: flex; align-items: center; gap: 6px; }
  .qty-btn {
    width: 26px; height: 26px;
    border: 1.5px solid #d1d5db; border-radius: 6px;
    background: #fff; font-size: 16px; font-weight: 700;
    color: #4f46e5; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .qty-btn:hover { background: #ede9fe; border-color: #4f46e5; }
  .qty-val { font-size: 14px; font-weight: 700; min-width: 22px; text-align: center; }
  .remove-btn {
    background: none; border: none; cursor: pointer;
    font-size: 16px; color: #ef4444; padding: 2px 4px;
    border-radius: 4px; transition: background .12s;
  }
  .remove-btn:hover { background: #fee2e2; }

  /* cart total */
  .cart-total {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1.5px dashed #e5e7eb;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-total .label { font-size: 13px; color: #6b7280; font-weight: 600; }
  .cart-total .amount { font-size: 18px; font-weight: 800; color: #111827; }

  /* confirm button */
  #confirm-btn {
    width: 100%;
    margin-top: 14px;
    height: 46px;
    background: linear-gradient(90deg, #4f46e5, #6366f1);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
    letter-spacing: .3px;
  }
  #confirm-btn:hover { opacity: .88; }
  #confirm-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ── Receipt modal ────────────────────────────────────────────────────── */
  .modal-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(3px);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 18px;
    padding: 32px 30px 28px;
    width: 460px;
    max-width: 95vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: popIn .18s ease;
  }
  @keyframes popIn {
    from { transform: scale(.94); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .modal-icon { font-size: 44px; text-align: center; margin-bottom: 10px; }
  .modal h3 { font-size: 20px; font-weight: 800; color: #111827; text-align: center; margin-bottom: 4px; }
  .modal .sub { font-size: 13px; color: #6b7280; text-align: center; margin-bottom: 20px; }
  .receipt-line {
    display: flex; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }
  .receipt-line:last-child { border-bottom: none; }
  .receipt-line .rname { color: #374151; font-weight: 500; }
  .receipt-line .rprice { color: #111827; font-weight: 700; }
  .receipt-line.fail .rname { color: #ef4444; }
  .receipt-line.fail .rprice { color: #ef4444; }
  .receipt-total {
    margin-top: 14px; padding-top: 14px;
    border-top: 2px solid #111827;
    display: flex; justify-content: space-between;
    font-size: 16px; font-weight: 800;
  }
  .modal-close {
    width: 100%; margin-top: 22px; height: 44px;
    background: #4f46e5; color: #fff;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .modal-close:hover { background: #4338ca; }

  /* ── Toast ────────────────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #f9fafb;
    padding: 12px 22px; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
    z-index: 300;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<nav>
  <span class="logo">📦</span>
  <h1>ProStock — Staff Purchase Portal</h1>
  <span class="badge" id="nav-badge">Loading inventory…</span>
</nav>

<div class="layout">

  <div>
    <div class="card" style="margin-bottom:18px;">
      <div class="card-body">
        <div class="staff-row">
          <label>👤 Staff Name</label>
          <input type="text" id="staff-name" placeholder="Enter your name…" maxlength="60" />
        </div>
        <div class="search-wrap">
          <input type="text" id="search-box" placeholder="🔍  Search items by name or SKU…" />
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="icon">🛍️</span>
        <h2>Available Items</h2>
        <span id="item-count" style="margin-left:auto;font-size:12px;color:#9ca3af;"></span>
      </div>
      <div class="card-body">
        <div id="item-grid">
          <div class="empty-state"><div class="big">⏳</div>Loading items…</div>
        </div>
      </div>
    </div>
  </div>

  <div class="cart-panel">
    <div class="card">
      <div class="card-header">
        <span class="icon">🛒</span>
        <h2>Purchase Cart</h2>
        <span id="cart-count" style="margin-left:auto;font-size:12px;color:#9ca3af;">0 items</span>
      </div>
      <div class="card-body">
        <div id="cart-body">
          <div class="cart-empty"><div class="big">🛒</div>Cart is empty.<br>Click an item to add it.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-icon" id="modal-icon">✅</div>
    <h3 id="modal-title">Purchase Confirmed!</h3>
    <p class="sub" id="modal-sub">Here is your receipt.</p>
    <div id="receipt-lines"></div>
    <div class="receipt-total" id="receipt-total" style="display:none">
      <span>Total Paid</span><span id="receipt-grand"></span>
    </div>
    <button class="modal-close" onclick="closeModal()">Done</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allItems = [];       // [{id, name, sku, price, quantity, category_name, image_path}]
let cart     = {};       // { itemId: qty }

// ── Fetch catalog ──────────────────────────────────────────────────────────
async function loadItems(query = "") {
  const url = "/api/items" + (query ? `?q=${encodeURIComponent(query)}` : "");
  try {
    const res  = await fetch(url);
    allItems   = await res.json();
    renderGrid(allItems);
    document.getElementById("nav-badge").textContent =
      `${allItems.length} item${allItems.length !== 1 ? "s" : ""} in inventory`;
    document.getElementById("item-count").textContent =
      `${allItems.length} result${allItems.length !== 1 ? "s" : ""}`;
  } catch(e) {
    document.getElementById("item-grid").innerHTML =
      `<div class="empty-state"><div class="big">⚠️</div>Could not reach the server.<br>Make sure the app is running.</div>`;
  }
}

// ── Render catalog grid ────────────────────────────────────────────────────
function renderGrid(items) {
  const grid = document.getElementById("item-grid");
  if (!items.length) {
    grid.innerHTML = `<div class="empty-state"><div class="big">🔍</div>No items found.</div>`;
    return;
  }
  grid.innerHTML = items.map(item => {
    const oos     = item.quantity === 0;
    const low     = item.quantity > 0 && item.quantity <= 5;
    const inCart  = cart[item.id] > 0;
    const stockCls = oos ? "none" : (low ? "low" : "");
    const stockTxt = oos ? "Out of stock" : (low ? `Low: ${item.quantity} left` : `${item.quantity} in stock`);
    const imgHtml  = item.image_path
      ? `<div class="item-img"><img src="/item-image?path=${encodeURIComponent(item.image_path)}" alt="" onerror="this.parentElement.innerHTML='📦'" /></div>`
      : `<div class="item-img">📦</div>`;
    return `
      <div class="item-card${oos ? " out-of-stock" : ""}${inCart ? " in-cart" : ""}"
           onclick="${oos ? "" : `addToCart(${item.id})`}"
           data-id="${item.id}">
        <span class="add-badge">In cart ✓</span>
        ${imgHtml}
        <div class="item-name">${esc(item.name)}</div>
        <div class="item-cat">${esc(item.category_name)}</div>
        <div class="item-foot">
          <span class="item-price">₱${item.price.toFixed(2)}</span>
          <span class="item-stock ${stockCls}">${stockTxt}</span>
        </div>
      </div>`;
  }).join("");
}

// ── Cart operations ────────────────────────────────────────────────────────
function addToCart(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item || item.quantity === 0) return;
  cart[itemId] = (cart[itemId] || 0) + 1;
  if (cart[itemId] > item.quantity) {
    cart[itemId] = item.quantity;
    showToast(`Max stock reached for "${item.name}"`);
  } else {
    showToast(`"${item.name}" added to cart`);
  }
  renderCart();
  updateGridBadges();
}

function changeQty(itemId, delta) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;
  cart[itemId] = (cart[itemId] || 0) + delta;
  if (cart[itemId] > item.quantity) cart[itemId] = item.quantity;
  if (cart[itemId] <= 0) {
    delete cart[itemId];
  }
  renderCart();
  updateGridBadges();
}

function removeFromCart(itemId) {
  delete cart[itemId];
  renderCart();
  updateGridBadges();
}

function renderCart() {
  const body   = document.getElementById("cart-body");
  const ids    = Object.keys(cart).map(Number);
  const count  = ids.reduce((s, id) => s + cart[id], 0);
  document.getElementById("cart-count").textContent =
    `${count} item${count !== 1 ? "s" : ""}`;

  if (!ids.length) {
    body.innerHTML = `
      <div class="cart-empty"><div class="big">🛒</div>Cart is empty.<br>Click an item to add it.</div>`;
    return;
  }

  let total = 0;
  const lines = ids.map(id => {
    const item  = allItems.find(i => i.id === id);
    if (!item) return "";
    const qty   = cart[id];
    const sub   = item.price * qty;
    total += sub;
    return `
      <div class="cart-line">
        <div class="cart-line-info">
          <div class="cart-line-name">${esc(item.name)}</div>
          <div class="cart-line-price">₱${item.price.toFixed(2)} × ${qty} = <b>₱${sub.toFixed(2)}</b></div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty(${id}, -1)">−</button>
          <span class="qty-val">${qty}</span>
          <button class="qty-btn" onclick="changeQty(${id}, 1)">＋</button>
        </div>
        <button class="remove-btn" onclick="removeFromCart(${id})" title="Remove">✕</button>
      </div>`;
  }).join("");

  body.innerHTML = `
    <div id="cart-lines">${lines}</div>
    <div class="cart-total">
      <span class="label">Total</span>
      <span class="amount">₱${total.toFixed(2)}</span>
    </div>
    <button id="confirm-btn" onclick="confirmPurchase()">Confirm Purchase</button>`;
}

function updateGridBadges() {
  document.querySelectorAll(".item-card").forEach(card => {
    const id = Number(card.dataset.id);
    if (cart[id]) {
      card.classList.add("in-cart");
    } else {
      card.classList.remove("in-cart");
    }
  });
}

// ── Confirm purchase ───────────────────────────────────────────────────────
async function confirmPurchase() {
  const staffName = document.getElementById("staff-name").value.trim() || "Staff";
  const ids = Object.keys(cart).map(Number);
  if (!ids.length) return;

  const btn = document.getElementById("confirm-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Processing…"; }

  const payload = {
    staff_name: staffName,
    items: ids.map(id => ({ id, qty: cart[id] }))
  };

  try {
    const res  = await fetch("/api/purchase", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    showReceipt(data, staffName);
    if (data.ok) {
      cart = {};
      renderCart();
      updateGridBadges();
      await loadItems(document.getElementById("search-box").value.trim());
    }
  } catch(e) {
    showToast("Network error — please try again.");
    if (btn) { btn.disabled = false; btn.textContent = "Confirm Purchase"; }
  }
}

// ── Receipt modal ──────────────────────────────────────────────────────────
function showReceipt(data, staffName) {
  const allOk   = data.ok;
  const results = data.results || [];

  document.getElementById("modal-icon").textContent  = allOk ? "✅" : "⚠️";
  document.getElementById("modal-title").textContent = allOk ? "Purchase Confirmed!" : "Partial / Failed";
  document.getElementById("modal-sub").textContent   =
    `Staff: ${staffName} · ${new Date().toLocaleString()}`;

  let grand = 0;
  const lines = results.map(r => {
    if (r.ok) {
      grand += r.line_total;
      return `
        <div class="receipt-line">
          <span class="rname">${esc(r.name)} × ${r.qty_sold}</span>
          <span class="rprice">₱${r.line_total.toFixed(2)}</span>
        </div>`;
    } else {
      return `
        <div class="receipt-line fail">
          <span class="rname">✗ ${esc(r.name)} (${r.error})</span>
          <span class="rprice">—</span>
        </div>`;
    }
  }).join("");

  document.getElementById("receipt-lines").innerHTML = lines;

  const totalEl = document.getElementById("receipt-total");
  if (grand > 0) {
    totalEl.style.display = "flex";
    document.getElementById("receipt-grand").textContent = `₱${grand.toFixed(2)}`;
  } else {
    totalEl.style.display = "none";
  }

  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

// ── Escape HTML ────────────────────────────────────────────────────────────
function esc(str) {
  return String(str ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Search (debounced) ─────────────────────────────────────────────────────
let searchTimer;
document.getElementById("search-box").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadItems(e.target.value.trim()), 280);
});

// ── Close modal on backdrop click ──────────────────────────────────────────
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});

// ── Auto-refresh every 30 s to reflect desktop app changes ────────────────
setInterval(() => loadItems(document.getElementById("search-box").value.trim()), 30000);

// ── Init ───────────────────────────────────────────────────────────────────
loadItems();
</script>
</body>
</html>
